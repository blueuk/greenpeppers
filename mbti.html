<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>풋살 포지션 유형 테스트 v0.2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root{
    --bg:#0f1a14; --card:#17251d; --line:#27392e; --text:#eef5f0; --muted:#9db3a5;
    --accent:#c6f432; --accent-ink:#13200a; --gk:#ffb547;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
    background-image:radial-gradient(circle at 50% -10%,#1f3a28 0,transparent 60%);}
  .wrap{max-width:480px;margin:0 auto;padding:28px 20px 48px}
  h1{font-size:28px;font-weight:900;line-height:1.25;letter-spacing:-0.5px}
  h1 em{font-style:normal;color:var(--accent)}
  .sub{color:var(--muted);margin-top:10px;line-height:1.6;font-size:15px}
  .pitch{margin:28px 0;border:2px solid var(--line);border-radius:14px;height:150px;position:relative;overflow:hidden}
  .pitch:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid var(--line)}
  .pitch:after{content:"";position:absolute;left:50%;top:50%;width:54px;height:54px;border:2px solid var(--line);border-radius:50%;transform:translate(-50%,-50%)}
  .dot{position:absolute;padding:4px 9px;border-radius:20px;font-size:12px;font-weight:700;transform:translate(-50%,-50%);z-index:1}
  .dot.f{background:var(--accent);color:var(--accent-ink)}
  .dot.g{background:var(--gk);color:#2a1800}
  button{font-family:inherit;cursor:pointer;border:none}
  .btn{width:100%;padding:17px;border-radius:14px;font-size:17px;font-weight:700;background:var(--accent);color:var(--accent-ink);transition:transform .1s}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line);margin-top:10px}
  .btn.gk{background:var(--gk);color:#2a1800}
  .axes{margin-top:26px;display:grid;gap:8px}
  .axis-row{display:flex;justify-content:space-between;background:var(--card);border-radius:10px;padding:11px 14px;font-size:14px}
  .axis-row b{color:var(--accent)}
  .hidden{display:none}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .back{background:none;color:var(--muted);font-size:22px;padding:4px 8px}
  .bar{flex:1;height:8px;background:var(--line);border-radius:8px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .count{color:var(--muted);font-size:13px;min-width:44px;text-align:right}
  .tag{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:rgba(198,244,50,.1);padding:5px 10px;border-radius:20px;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;line-height:1.45;min-height:96px;letter-spacing:-0.3px}
  .scale{margin-top:24px;display:grid;gap:9px}
  .opt{background:var(--card);color:var(--text);border:1.5px solid var(--line);border-radius:12px;padding:15px 16px;font-size:16px;text-align:left;display:flex;align-items:center;gap:12px}
  .opt .n{width:28px;height:28px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
  .opt.sel{border-color:var(--accent)}
  .opt.sel .n{background:var(--accent);color:var(--accent-ink)}
  .branch{display:grid;gap:12px;margin-top:30px}
  .branch .opt{padding:20px;font-size:17px;font-weight:700}
  .branch small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:4px}
  .result-head{text-align:center;padding:10px 0 6px}
  .pos{display:inline-block;padding:6px 14px;border-radius:20px;font-weight:700;font-size:14px;background:var(--accent);color:var(--accent-ink)}
  .pos.gkc{background:var(--gk);color:#2a1800}
  .code{font-size:54px;font-weight:900;letter-spacing:4px;margin-top:14px;line-height:1}
  .tname{font-size:24px;font-weight:900;margin-top:10px}
  .desc{color:#d6e3da;line-height:1.7;margin-top:18px;font-size:15px;background:var(--card);border-radius:14px;padding:18px}
  .sec{margin-top:22px}
  .sec h3{font-size:14px;color:var(--muted);font-weight:500;margin-bottom:10px}
  .meter{margin-bottom:14px}
  .meter-labels{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
  .meter-labels .on{color:var(--accent);font-weight:700}
  .meter-track{height:10px;background:var(--line);border-radius:10px;position:relative;overflow:hidden}
  .meter-fill{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:10px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 12px;font-size:13px}
  .note{background:rgba(255,181,71,.08);border:1px solid rgba(255,181,71,.3);border-radius:12px;padding:14px;font-size:14px;line-height:1.6;margin-top:22px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:12px 18px;border-radius:30px;font-weight:700;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .all{margin-top:30px}
  .all details{background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:8px}
  .all summary{cursor:pointer;font-weight:700;font-size:15px}
  .all ul{list-style:none;margin-top:10px;display:grid;gap:6px}
  .all li{font-size:14px;color:#d6e3da}
  .all li b{color:var(--accent);display:inline-block;min-width:58px}
</style>
</head>
<body>
<div class="wrap">

  <!-- 시작 -->
  <section id="s-start">
    <h1>나는 어떤<br><em>풋살 선수</em>일까?</h1>
    <p class="sub">4가지 축으로 알아보는 풋살 포지션 유형 테스트.<br>필드 16유형 + 골레이 4유형, 약 4분 걸려요.</p>
    <div class="pitch">
      <span class="dot g" style="left:7%;top:50%">골레이</span>
      <span class="dot f" style="left:28%;top:50%">픽소</span>
      <span class="dot f" style="left:45%;top:18%">센트로</span>
      <span class="dot f" style="left:64%;top:82%">아라</span>
      <span class="dot f" style="left:84%;top:50%">피보</span>
    </div>
    <button class="btn" onclick="go('s-branch')">테스트 시작</button>
    <div class="axes">
      <div class="axis-row"><span><b>F</b> 전방</span><span>후방 <b>B</b></span></div>
      <div class="axis-row"><span><b>C</b> 중앙</span><span>측면 <b>W</b></span></div>
      <div class="axis-row"><span><b>P</b> 파워</span><span>테크닉 <b>T</b></span></div>
      <div class="axis-row"><span><b>S</b> 해결</span><span>연결 <b>L</b></span></div>
    </div>
    <div class="all" id="all-types"></div>
  </section>

  <!-- 분기 -->
  <section id="s-branch" class="hidden">
    <div class="top"><button class="back" onclick="go('s-start')">←</button></div>
    <span class="tag">시작 전에</span>
    <p class="q">경기에서 주로 골레이를 보나요?</p>
    <div class="branch">
      <button class="opt" onclick="startTest('gk')">🧤 네, 주로 골레이를 봐요<small>16문항 · 골레이 유형 4가지 중 하나로 판정</small></button>
      <button class="opt" onclick="startTest('field')">⚽ 아니요, 필드에서 뛰어요<small>32문항 · 필드 유형 16가지 중 하나로 판정</small></button>
    </div>
  </section>

  <!-- 질문 -->
  <section id="s-quiz" class="hidden">
    <div class="top">
      <button class="back" onclick="prev()">←</button>
      <div class="bar"><i id="bar"></i></div>
      <span class="count" id="count"></span>
    </div>
    <span class="tag" id="qtag"></span>
    <p class="q" id="qtext"></p>
    <p class="sub hidden" id="qhint" style="margin-top:4px;font-size:13px">최근 경기들을 떠올리며, 실제로 얼마나 자주 그렇게 하는지로 답해 주세요.</p>
    <div class="scale" id="scale"></div>
  </section>

  <!-- 결과 -->
  <section id="s-result" class="hidden">
    <div class="result-head">
      <span class="pos" id="r-pos"></span>
      <div class="code" id="r-code"></div>
      <div class="tname" id="r-name"></div>
    </div>
    <p class="desc" id="r-desc"></p>
    <div class="sec">
      <h3>나의 성향</h3>
      <div id="r-meters"></div>
    </div>
    <div class="sec">
      <h3>강점</h3>
      <div class="chips" id="r-str"></div>
    </div>
    <div class="sec">
      <h3>이런 선수와 잘 맞아요</h3>
      <div class="chips" id="r-match"></div>
    </div>
    <div class="note hidden" id="r-gknote">🧤 골레이도 필드에서 뛸 때가 있죠? 필드 테스트도 해보면 필드 유형까지 알 수 있어요.</div>
    <div style="margin-top:24px">
      <button class="btn" onclick="copyResult()">결과 복사해서 단톡방에 공유</button>
      <button class="btn gk hidden" id="r-tofield" style="margin-top:10px" onclick="startTest('field')">필드 테스트도 해보기</button>
      <button class="btn ghost" onclick="go('s-start')">처음으로</button>
    </div>
  </section>

</div>
<div class="toast" id="toast">복사됐어요!</div>

<script>
const AX = {

  {ax:'FB',t:'실점을 막는 게 골을 넣는 것보다 더 중요하다고 느낀다',r:1},
  {ax:'FB',t:'경기 중 내 위치는 대체로 하프라인보다 앞이다'},
  {ax:'CW',t:'터치라인 쪽에서 공을 받는 게 편하다'},
  {ax:'CW',t:'측면에서 1:1을 거는 상황을 즐긴다'},
  {ax:'CW',t:'중앙에서 등지고 받는 건 부담스럽다'},
  {ax:'CW',t:'사이드로 넓게 벌려 공간을 만든다'},

  {ax:'CW',t:'사이드에서 크로스나 컷백을 자주 시도한다'},
  {ax:'CW',t:'경기장 한가운데에서 공을 받는 게 편하다',r:1},
  {ax:'CW',t:'상대 수비를 넓게 벌리는 움직임을 자주 한다'},

  {ax:'PT',t:'어깨싸움이나 경합에서 자주 이긴다'},

  {ax:'PT',t:'화려한 드리블이나 페인트가 내 무기다',r:1},
  {ax:'PT',t:'정확하게 차는 것보다 강하게 차는 슈팅이 자신 있다'},

  {ax:'SL',t:'승부처에서 공을 달라고 먼저 외친다'}
];
const GK_Q = [
  {ax:'PT',t:'슈팅을 잡아내기보다 쳐내거나 몸으로 막아낸다'},
  {ax:'PT',t:'가까운 거리 슈팅에 다이빙하거나 몸을 던진다'},
  {ax:'PT',t:'공을 잡으면 발보다 손으로 던져서 배급한다'},
  {ax:'PT',t:'백패스를 받으면 패스로 연결하기보다 바로 걷어낸다'},
  {ax:'PT',t:'경기 중 넘어지거나 몸을 날리는 장면이 나온다'},
  {ax:'PT',t:'골킥이나 배급을 발로 짧게 연결한다',r:1},
  {ax:'PT',t:'빌드업을 위해 박스 밖으로 나와 동료와 패스를 주고받는다',r:1},
  {ax:'PT',t:'상대가 압박해 와도 발로 제치거나 패스로 풀어낸다',r:1},
  {ax:'SL',t:'상대가 뒷공간으로 침투하면 박스 밖까지 나가서 끊는다'},
  {ax:'SL',t:'1:1 상황에서 기다리지 않고 먼저 달려나가 각을 좁힌다'},
  {ax:'SL',t:'스루패스가 오면 수비수보다 먼저 공으로 달려간다'},
  {ax:'SL',t:'공을 잡자마자 바로 역습 패스나 던지기를 한다'},
  {ax:'SL',t:'경기 중 수비수에게 마크나 위치를 말로 지시한다',r:1},
  {ax:'SL',t:'세트피스 때 벽 위치나 마크를 내가 정해 준다',r:1},
  {ax:'SL',t:'공을 잡으면 동료들이 자리 잡을 때까지 기다렸다가 배급한다',r:1},
  {ax:'SL',t:'상대가 공격해 오면 나가기보다 골문 앞에서 자리를 지킨다',r:1}
];
// 같은 축 문항이 연달아 나오지 않도록 축별로 번갈아 배치
function interleave(list){
  const g={}; list.forEach(q=>{(g[q.ax]=g[q.ax]||[]).push(q);});
  const keys=Object.keys(g), out=[]; const n=Math.max(...keys.map(k=>g[k].length));
  for(let i=0;i<n;i++) keys.forEach(k=>{ if(g[k][i]) out.push(g[k][i]); });
  return out;
}
const TAG = {FB:'공격 vs 수비',CW:'중앙 vs 측면',PT:'파워 vs 테크닉',SL:'해결 vs 연결'};
const SCALE = ['전혀 아니다','아닌 편이다','보통이다','그런 편이다','매우 그렇다'];
const SCALE_FREQ = ['거의 없다','가끔 있다','반반이다','자주 있다','거의 항상'];

const TYPES = {
  // 피보
  FCPL:{pos:'피보',name:'타겟형 피보',desc:'상대 골문 앞에서 등지고 버티며 공을 지켜내고, 올라오는 동료에게 연결해 주는 팀의 기준점이에요. 롱패스의 도착지이자 공격의 시작점입니다.',str:['포스트 플레이','볼 키핑','등지고 연계'],match:['FWTS','BCTL']},
  FCPS:{pos:'피보',name:'파워 피니셔 피보',desc:'몸싸움으로 자리를 잡고 한 번의 터치로 마무리하는 득점 기계. 박스 안에서 가장 무서운 선수예요.',str:['몸싸움 후 슈팅','세컨볼 집중','강한 슈팅'],match:['FWTL','BCTL']},
  FCTL:{pos:'피보',name:'원투 연계형 피보',desc:'짧은 원투 패스와 리턴으로 수비를 무너뜨리는 연결고리. 동료를 빛나게 해 주는 전방의 플레이메이커예요.',str:['원투 패스','공간 인식','퍼스트 터치'],match:['FWPS','FWTS']},
  FCTS:{pos:'피보',name:'기술형 골게터 피보',desc:'좁은 공간에서도 턴 한 번으로 슈팅 각을 만드는 해결사. 개인 기술로 골을 만들어 냅니다.',str:['턴 동작','좁은 공간 드리블','정교한 마무리'],match:['FWTL','BCTL']},
  // 아라
  FWPS:{pos:'아라',name:'공격적 침투형 아라',desc:'스피드로 측면 뒷공간을 파고들어 직접 슈팅까지 가져가는 돌격대장. 역습 상황에서 가장 위협적이에요.',str:['뒷공간 침투','스프린트','반대편 포스트 마무리'],match:['FCTL','BCTL']},
  FWPL:{pos:'아라',name:'스피드 왕복형 아라',desc:'지치지 않는 체력으로 측면을 오르내리며 공격과 수비를 모두 지원해요. 팀의 엔진 같은 존재입니다.',str:['활동량','공수 전환','측면 크로스'],match:['FCPS','BCPS']},
  FWTS:{pos:'아라',name:'측면 돌파형 아라',desc:'1:1 드리블로 측면을 찢고 직접 슈팅이나 컷백을 만들어 내는 크랙. 막힌 경기를 풀어주는 카드예요.',str:['1:1 돌파','개인기','안쪽 파고들기'],match:['FCPL','BCPS']},
  FWTL:{pos:'아라',name:'찬스메이커 아라',desc:'측면에서 시야와 패스로 결정적인 찬스를 만드는 선수. 피보와의 호흡이 맞으면 어시스트가 쏟아져요.',str:['킬패스','시야','템포 조절'],match:['FCPS','FCTS']},
  // 픽소
  BCPS:{pos:'픽소',name:'스토퍼형 픽소',desc:'몸싸움과 태클로 상대 공격을 정면에서 끊어내는 최후의 벽. 상대 피보가 가장 싫어하는 타입이에요.',str:['대인 수비','태클','몸싸움'],match:['FWTS','FCTL']},
  BCPL:{pos:'픽소',name:'수비 리더형 픽소',desc:'뒤에서 전체를 보며 라인과 마크를 조율하는 리더. 단단한 피지컬에 안정감을 더한 팀의 중심축이에요.',str:['수비 조율','커버링','콜 플레이'],match:['FWTS','FCTS']},
  BCTS:{pos:'픽소',name:'중거리 슈터 픽소',desc:'후방에서 공을 잡으면 과감한 중거리 슈팅으로 직접 골을 노려요. 수비수인데 득점력도 있는 무기형 선수.',str:['중거리 슈팅','볼 탈취 후 전진','과감함'],match:['FCPL','FWPL']},
  BCTL:{pos:'픽소',name:'빌드업형 픽소',desc:'후방에서 패스로 공격을 설계하는 플레이메이커. 압박을 벗겨내고 전방으로 공을 정확히 배달해요.',str:['빌드업','롱패스','탈압박'],match:['FCPL','FWPS']},
  // 센트로
  BWPS:{pos:'센트로',name:'압박형 센트로',desc:'넓은 범위를 뛰어다니며 공을 빼앗아 내는 압박 전문가. 상대가 편하게 공을 돌리지 못하게 만들어요.',str:['전방 압박','볼 탈취','활동량'],match:['BCTL','FCTS']},
  BWPL:{pos:'센트로',name:'커버형 센트로',desc:'빈 공간을 채우고 동료의 뒤를 받쳐 주는 살림꾼. 눈에 덜 띄지만 없으면 팀이 무너지는 타입이에요.',str:['커버 플레이','위치 선정','헌신'],match:['FWTS','FCTS']},
  BWTS:{pos:'센트로',name:'역습형 센트로',desc:'공을 끊자마자 드리블로 치고 나가 역습을 직접 이끄는 선수. 수비에서 공격으로의 전환이 가장 빨라요.',str:['역습 전개','전진 드리블','전환 속도'],match:['FCPL','BCPL']},
  BWTL:{pos:'센트로',name:'밸런스형 센트로',desc:'어느 자리에 넣어도 제 몫을 하는 만능형. 패스와 위치 선정으로 팀의 균형을 잡아 줘요.',str:['멀티 포지션','패스 안정성','경기 이해도'],match:['FCPS','FWPS']},
  // 골레이
  'G-PS':{pos:'골레이',name:'선방형 골레이',desc:'반사신경과 몸을 날리는 세이브로 골문을 지키는 수호신. 결정적인 순간 한 번의 선방으로 경기를 바꿔요.',str:['반사신경','근거리 선방','담력'],match:['BCPL','BWPL']},
  'G-PL':{pos:'골레이',name:'지휘형 골레이',desc:'가장 뒤에서 경기 전체를 보며 목소리로 수비를 조율하는 리더. 골레이가 아니라 감독 같은 존재예요.',str:['수비 지시','위치 선정','안정감'],match:['BCPS','BWPS']},
  'G-TS':{pos:'골레이',name:'스위퍼형 골레이',desc:'과감하게 튀어나와 1:1과 침투를 미리 끊어내는 공격적인 골레이. 뒷공간 걱정을 덜어 줍니다.',str:['1:1 대응','과감한 판단','뒷공간 커버'],match:['BCTL','BWTL']},
  'G-TL':{pos:'골레이',name:'빌드업형 골레이',desc:'발밑이 좋아 공격 전개의 출발점이 되는 골레이. 플라잉 골레이로 수적 우위를 만들 수도 있어요.',str:['발밑 기술','빠른 배급','플라잉 골레이'],match:['BCTL','FCPL']}
};

let mode='field', qs=[], idx=0, ans=[];

function go(id){
  document.querySelectorAll('section').forEach(s=>s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  window.scrollTo(0,0);
}
function startTest(m){
  mode=m; qs = interleave(m==='gk'?GK_Q:FIELD_Q); idx=0; ans=new Array(qs.length).fill(null);
  go('s-quiz'); render();
}
function render(){
  const q=qs[idx];
  document.getElementById('bar').style.width=(idx/qs.length*100)+'%';
  document.getElementById('count').textContent=(idx+1)+' / '+qs.length;
  document.getElementById('qtag').textContent=(mode==='gk'?'골레이 · ':'')+TAG[q.ax];
  document.getElementById('qtext').textContent=q.t;
  const sc=document.getElementById('scale'); sc.innerHTML='';
  document.getElementById('qhint').classList.toggle('hidden',mode!=='gk');
  (mode==='gk'?SCALE_FREQ:SCALE).forEach((label,i)=>{
    const b=document.createElement('button');
    b.className='opt'+(ans[idx]===i+1?' sel':'');
    b.innerHTML='<span class="n">'+(i+1)+'</span>'+label;
    b.onclick=()=>{ans[idx]=i+1; b.classList.add('sel'); setTimeout(next,180);};
    sc.appendChild(b);
  });
}
function next(){ if(idx<qs.length-1){idx++;render();} else finish(); }
function prev(){ if(idx>0){idx--;render();} else go('s-branch'); }

function score(){
  const s={}, n={};
  qs.forEach((q,i)=>{ const v=q.r?6-ans[i]:ans[i]; s[q.ax]=(s[q.ax]||0)+v; n[q.ax]=(n[q.ax]||0)+1; });
  const pct={};
  Object.keys(s).forEach(k=>{ pct[k]=Math.round((s[k]-n[k])/(4*n[k])*100); }); // 0~100, 높을수록 a 성향
  return pct;
}
function finish(){
  const p=score();
  const pick=(k)=>p[k]>=50?AX[k].a:AX[k].b;
  let code;
  if(mode==='gk') code='G-'+pick('PT')+pick('SL');
  else code=pick('FB')+pick('CW')+pick('PT')+pick('SL');
  showResult(code,p);
}
function showResult(code,p){
  const t=TYPES[code];
  const isGK=mode==='gk';
  const pos=document.getElementById('r-pos');
  pos.textContent=t.pos; pos.className='pos'+(isGK?' gkc':'');
  document.getElementById('r-code').textContent=code;
  document.getElementById('r-name').textContent=t.name;
  document.getElementById('r-desc').textContent=t.desc;
  const m=document.getElementById('r-meters'); m.innerHTML='';
  Object.keys(p).forEach(k=>{
    const a=p[k], ax=AX[k], onA=a>=50;
    const val=onA?a:100-a;
    m.innerHTML+=`<div class="meter"><div class="meter-labels">
      <span class="${onA?'on':''}">${ax.a} ${ax.an} ${a}%</span>
      <span class="${!onA?'on':''}">${100-a}% ${ax.bn} ${ax.b}</span></div>
      <div class="meter-track"><div class="meter-fill" style="${onA?'left:0':'right:0'};width:${val}%"></div></div></div>`;
  });
  document.getElementById('r-str').innerHTML=t.str.map(s=>`<span class="chip">${s}</span>`).join('');
  document.getElementById('r-match').innerHTML=t.match.map(c=>`<span class="chip">${c} ${TYPES[c].name}</span>`).join('');
  document.getElementById('r-gknote').classList.toggle('hidden',!isGK);
  document.getElementById('r-tofield').classList.toggle('hidden',!isGK);
  window._last={code,t,p};
  go('s-result');
}
function copyResult(){
  const {code,t,p}=window._last;
  const lines=Object.keys(p).map(k=>{const a=p[k],ax=AX[k];return `${ax.an} ${a}% / ${ax.bn} ${100-a}%`;});
  const txt=`⚽ 풋살 포지션 유형 테스트 결과\n[${t.pos}] ${code} · ${t.name}\n${lines.join('\n')}\n강점: ${t.str.join(', ')}`;
  const done=()=>{const el=document.getElementById('toast');el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1600);};
  try{ navigator.clipboard.writeText(txt).then(done).catch(()=>fallback(txt,done)); }catch(e){ fallback(txt,done); }
}
function fallback(txt,done){
  const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
  try{document.execCommand('copy');done();}catch(e){} ta.remove();
}

// 전체 유형 목록
(function(){
  const groups=['피보','아라','픽소','센트로','골레이'];
  const el=document.getElementById('all-types');
  el.innerHTML='<h3 style="font-size:14px;color:var(--muted);font-weight:500;margin-bottom:10px">전체 20유형 보기</h3>'+
    groups.map(g=>`<details><summary>${g}</summary><ul>${
      Object.entries(TYPES).filter(([c,t])=>t.pos===g).map(([c,t])=>`<li><b>${c}</b>${t.name}</li>`).join('')
    }</ul></details>`).join('');
})();
