<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>풋고추FC 매치 엔진 V12.0 (실전 전술 AI)</title>
    <style>
        body { background-color: #1a252f; color: white; font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 20px; min-width: 1240px; }
        h1 { margin-top: 0; color: #f1c40f; margin-bottom: 10px; text-align: center; }
        
        #main-container { display: flex; gap: 20px; width: 1200px; margin: 0 auto 20px auto; }
        
        #left-panel { display: flex; flex-direction: column; gap: 15px; flex: 1.5; }
        canvas { background-color: #27ae60; border: 4px solid #ecf0f1; border-radius: 4px; box-shadow: 0 0 15px rgba(0,0,0,0.5); width: 100%; }
        
        .team-lists { display: flex; gap: 15px; }
        .team-box { flex: 1; background: #34495e; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .team-box-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #7f8c8d; padding-bottom: 5px; margin-bottom: 10px; }
        .team-box-header h3 { margin: 0; font-size: 16px; }
        .auto-btn { background: #3498db; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .team-count { font-size: 12px; color: #f1c40f; }
        
        .team-members { display: flex; flex-direction: column; gap: 8px; min-height: 80px; }
        .player-row { display: flex; justify-content: space-between; align-items: center; background: #2c3e50; padding: 6px; border-radius: 6px; border: 1px solid #7f8c8d; }
        .player-row-name { font-size: 13px; font-weight: bold; width: 50px; }
        .pos-select { padding: 3px; font-size: 11px; background: #ecf0f1; color: #333; border-radius: 4px; border: none; outline: none; width: 65px; }
        .role-select { padding: 3px; font-size: 11px; background: #f39c12; color: #fff; border-radius: 4px; border: none; outline: none; width: 85px; font-weight: bold; }
        .remove-btn { background: #e74c3c; color: white; border: none; border-radius: 4px; padding: 4px 6px; font-size: 11px; cursor: pointer; font-weight: bold; }
        
        #right-panel { display: flex; flex-direction: column; gap: 15px; flex: 1.5; }
        #ui-panel { background: #2c3e50; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: flex; flex-direction: column;}
        
        @keyframes goalFlash {
            0% { background-color: #1abc9c; box-shadow: 0 0 0px transparent; transform: scale(1); }
            50% { background-color: #f1c40f; box-shadow: 0 0 30px #f1c40f, 0 0 10px #fff; transform: scale(1.05); color: #c0392b; }
            100% { background-color: #1abc9c; box-shadow: 0 0 0px transparent; transform: scale(1); }
        }
        .flash-anim { animation: goalFlash 0.5s ease-in-out infinite; }

        #scoreboard { font-size: 24px; font-weight: bold; text-align: center; margin-bottom: 5px; border-bottom: 2px solid #34495e; padding-bottom: 5px; background: #1abc9c; border-radius: 4px; padding: 5px; transition: all 0.3s;}
        #state-display { text-align: center; font-size: 13px; color: #f39c12; font-weight: bold; margin-bottom: 5px; min-height: 18px;}
        #tactics-display { text-align: center; font-size: 11px; color: #bdc3c7; background: #111; padding: 4px; border-radius: 4px; margin-bottom: 10px; }
        #timer { font-size: 18px; color: #f1c40f; text-align: center; margin-bottom: 5px; font-weight: bold; }
        
        .stats-board { display: grid; grid-template-columns: 1fr auto 1fr; gap: 4px; font-size: 11px; text-align: center; background: #111; padding: 8px; border-radius: 4px; margin-bottom: 10px; }
        .stats-label { color: #bdc3c7; font-size: 11px; grid-column: 2; }
        .stat-val-a { color: #cddc39; font-weight: bold; text-align: left; padding-left: 5px; }
        .stat-val-b { color: #e67e22; font-weight: bold; text-align: right; padding-right: 5px; }

        #match-log { height: 90px; background: #111; border: 1px solid #7f8c8d; border-radius: 4px; padding: 6px; overflow-y: auto; font-size: 11px; color: #ecf0f1; margin-bottom: 10px; display: flex; flex-direction: column; gap: 3px; }
        .log-line { border-bottom: 1px dashed #222; padding-bottom: 2px; line-height: 1.2; }

        #player-stats-container { background: #111; border: 1px solid #7f8c8d; border-radius: 4px; padding: 5px; max-height: 140px; overflow-y: auto; }
        #player-stats-table { width: 100%; border-collapse: collapse; font-size: 10px; text-align: center; color: white; }
        #player-stats-table th { background: #34495e; padding: 4px; position: sticky; top: 0; }
        #player-stats-table td { border-bottom: 1px solid #333; padding: 4px 2px; }
        .col-a { color: #cddc39; } .col-b { color: #e67e22; }

        .start-btn { width: 100%; padding: 10px; background: #e74c3c; color: white; font-weight: bold; font-size: 15px; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px;}
        .start-btn:disabled { background: #7f8c8d; cursor: not-allowed; }
        
        #bottom-panel { width: 1200px; margin: 0 auto; background: #34495e; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; }
        #bottom-panel h3 { margin: 0; border-bottom: 2px solid #7f8c8d; padding-bottom: 5px; font-size: 16px; }
        #player-pool { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 0; min-height: 50px; align-items: center; }
        .player-chip { background: #ecf0f1; color: #2c3e50; padding: 8px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; user-select: none; transition: all 0.1s; border: 2px solid transparent; }
        .player-chip.selected { background: #3498db; color: white; border-color: #2980b9; }
        .assign-controls { display: flex; gap: 15px; justify-content: center; margin-top: 10px; }
        .assign-btn { padding: 12px 30px; font-weight: bold; font-size: 15px; border: none; border-radius: 25px; cursor: pointer; color: #333; }
        .btn-a { background: #cddc39; } .btn-b { background: #e67e22; color: white; }
    </style>
</head>
<body>
    <h1>풋고추FC 실시간 시뮬레이터 V12.0 (실전 매크로 전술 AI)</h1>
    
    <div id="main-container">
        <div id="left-panel">
            <canvas id="pitch" width="650" height="380"></canvas>
            <div class="team-lists">
                <div class="team-box">
                    <div class="team-box-header">
                        <h3>TEAM A <span class="team-count" id="count-a">0/6</span></h3>
                        <button class="auto-btn" onclick="autoAssignPositions('A')">⚡ 자동배치</button>
                    </div>
                    <div id="team-a-list" class="team-members"></div>
                </div>
                <div class="team-box">
                    <div class="team-box-header">
                        <h3>TEAM B <span class="team-count" id="count-b">0/6</span></h3>
                        <button class="auto-btn" onclick="autoAssignPositions('B')">⚡ 자동배치</button>
                    </div>
                    <div id="team-b-list" class="team-members"></div>
                </div>
            </div>
        </div>
        
        <div id="right-panel">
            <div id="ui-panel">
                <div id="scoreboard">A팀 <span id="scoreA">0</span> : <span id="scoreB">0</span> B팀</div>
                <div id="state-display"></div>
                <div id="tactics-display">전술 시스템 대기 중...</div>
                <div id="timer">00:00 / 13:00</div>

                <div class="stats-board">
                    <div class="stat-val-a" id="stat-pos-a">50%</div><div class="stats-label">점유율</div><div class="stat-val-b" id="stat-pos-b">50%</div>
                    <div class="stat-val-a" id="stat-shot-a">0(0)</div><div class="stats-label">슈팅(유효)</div><div class="stat-val-b" id="stat-shot-b">0(0)</div>
                    <div class="stat-val-a" id="stat-pass-a">0% (0/0)</div><div class="stats-label">패스 성공/시도</div><div class="stat-val-b" id="stat-pass-b">0% (0/0)</div>
                    <div class="stat-val-a" id="stat-save-a">0</div><div class="stats-label">GK 선방</div><div class="stat-val-b" id="stat-save-b">0</div>
                    <div class="stat-val-a" id="stat-ck-a">0</div><div class="stats-label">코너킥</div><div class="stat-val-b" id="stat-ck-b">0</div>
                    <div class="stat-val-a" id="stat-fou-a">0</div><div class="stats-label">반칙</div><div class="stat-val-b" id="stat-fou-b">0</div>
                </div>

                <div id="match-log">
                    <div class="log-line" style="color:#f1c40f;">[시스템] 경기를 준비 중입니다...</div>
                </div>
                
                <div id="player-stats-container">
                    <table id="player-stats-table">
                        <thead>
                            <tr>
                                <th>이름(역할)</th><th>평점</th><th>골(도움)</th><th>슈팅(유효)</th><th>패스(%)</th><th>선방/태클</th>
                            </tr>
                        </thead>
                        <tbody id="player-stats-body">
                            <tr><td colspan="6" style="color:#7f8c8d;">경기 시작 시 갱신됩니다.</td></tr>
                        </tbody>
                    </table>
                </div>

                <button id="startBtn" class="start-btn" onclick="startGame()" disabled>선수 데이터 로딩 중...</button>
            </div>
        </div>
    </div>
    
    <div id="bottom-panel">
        <h3>대기 명단 (라벨 다중 선택)</h3>
        <div id="player-pool"></div>
        <div class="assign-controls">
            <button class="assign-btn btn-a" onclick="assignSelected('A')">◀ A팀 (형광) 배정</button>
            <button class="assign-btn btn-b" onclick="assignSelected('B')">B팀 (주황) 배정 ▶</button>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzdLjnfQEFuF0c6sH75D7gLyaPUg4LJWSDJLAym5kWKucot-CbY-QEkrDI7DnaxRYpe/exec";
        
        let allPlayersData = {}; 
        let availablePlayers = []; let selectedPoolPlayers = []; 
        let teamA = []; let teamB = []; 

        const ROLES = {
            '골레이로': ['방어 집중', '스위퍼 키퍼'],
            '픽소': ['수비 전담', '빌드업 리더'],
            '아라': ['측면 돌파', '중앙 침투'],
            '피보': ['포스트 플레이', '라인 브레이커']
        };

        let matchStats = {
            A: { posTicks: 1, shots: 0, sot: 0, passSucc: 0, passFail: 0, fouls: 0, saves: 0, corners: 0 },
            B: { posTicks: 1, shots: 0, sot: 0, passSucc: 0, passFail: 0, fouls: 0, saves: 0, corners: 0 }
        };

        // 💡 [핵심] V12.0 팀 전술 상태 객체 (매크로 전술 추가)
        let teamTactics = {
            A: { currentPattern: 'NONE', timer: 0, mainTarget: null, defMode: 'NORMAL', offMode: 'NORMAL' },
            B: { currentPattern: 'NONE', timer: 0, mainTarget: null, defMode: 'NORMAL', offMode: 'NORMAL' }
        };

        function addLog(text) {
            const logBox = document.getElementById('match-log');
            const min = String(Math.floor(matchTime / 60)).padStart(2, '0');
            const sec = String(Math.floor(matchTime % 60)).padStart(2, '0');
            const line = document.createElement('div'); line.className = 'log-line';
            line.innerHTML = `<span style="color:#f1c40f;">[${min}:${sec}]</span> ${text}`;
            logBox.prepend(line);
        }

        async function fetchFutsalAPI(data) {
            try {
                const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify(data) });
                const result = await response.json();
                if (!result.success) throw new Error(result.error); return result.data;
            } catch (e) { return null; }
        }

        async function initApp() {
            const poolDiv = document.getElementById('player-pool');
            const listData = await fetchFutsalAPI({ action: 'getMemberList' });
            availablePlayers = (listData && Array.isArray(listData)) ? listData : ["강승지", "강한팀", "김동섭", "김진혁", "배장원", "송정환"];
            const total = availablePlayers.length;

            for (let i = 0; i < total; i++) {
                const name = availablePlayers[i];
                poolDiv.innerHTML = `<span style="color:#3498db; font-size:14px; font-weight:bold;">능력치 로딩 중... [${i + 1}/${total}] (${name})</span>`;
                if (!allPlayersData[name]) {
                    const playerData = await fetchFutsalAPI({ action: 'getMemberInfo', memberName: name });
                    if (playerData && playerData.stats) {
                        allPlayersData[name] = {
                            이름: name, 
                            골레이로: parseFloat(playerData.stats[0]) || 0, 아라: parseFloat(playerData.stats[1]) || 0,
                            피보: parseFloat(playerData.stats[2]) || 0, 픽소: parseFloat(playerData.stats[3]) || 0,
                            체력: parseFloat(playerData.stats[6]) || 10, 스피드: parseFloat(playerData.stats[7]) || 10, 
                            가로채기: parseFloat(playerData.stats[17]) || 10,
                            슛: parseFloat(playerData.stats[23]) || 10, 패스: parseFloat(playerData.stats[25]) || 10, 
                            롱패스: parseFloat(playerData.stats[26]) || 10, 드리블: parseFloat(playerData.stats[27]) || 10
                        };
                    }
                    await new Promise(resolve => setTimeout(resolve, 20)); 
                }
            }
            document.getElementById('startBtn').innerText = "킥오프 (경기 시작)";
            document.getElementById('startBtn').disabled = false;
            renderPool(); drawPitch();
        }

        function renderPool() {
            const poolDiv = document.getElementById('player-pool'); poolDiv.innerHTML = '';
            availablePlayers.forEach(name => {
                const chip = document.createElement('div');
                chip.className = `player-chip ${selectedPoolPlayers.includes(name) ? 'selected' : ''}`;
                chip.innerText = name; chip.onclick = () => toggleSelection(name); poolDiv.appendChild(chip);
            });
        }

        function updateRoleOptions(teamId, name) {
            const posSelect = document.getElementById(`pos-${teamId}-${name}`);
            const roleSelect = document.getElementById(`role-${teamId}-${name}`);
            const selectedPos = posSelect.value;
            roleSelect.innerHTML = '';
            ROLES[selectedPos].forEach(role => {
                roleSelect.innerHTML += `<option value="${role}">${role}</option>`;
            });
        }

        function renderTeams() {
            document.getElementById('count-a').innerText = `${teamA.length}/6명`;
            document.getElementById('count-b').innerText = `${teamB.length}/6명`;
            const renderTeamList = (teamArr, teamId, listId, color) => {
                const list = document.getElementById(listId); list.innerHTML = '';
                teamArr.forEach(name => {
                    list.innerHTML += `<div class="player-row"><span class="player-row-name" style="color:${color};">${name}</span>
                        <select id="pos-${teamId}-${name}" class="pos-select" onchange="updateRoleOptions('${teamId}', '${name}')">
                            <option value="아라">아라</option><option value="픽소">픽소</option>
                            <option value="피보">피보</option><option value="골레이로">골레이로</option>
                        </select>
                        <select id="role-${teamId}-${name}" class="role-select">
                            <option value="측면 돌파">측면 돌파</option><option value="중앙 침투">중앙 침투</option>
                        </select>
                        <button class="remove-btn" onclick="removeFromTeam('${teamId}', '${name}')">제외</button></div>`;
                });
            };
            renderTeamList(teamA, 'A', 'team-a-list', '#cddc39'); 
            renderTeamList(teamB, 'B', 'team-b-list', '#e67e22');
        }

        function autoAssignPositions(teamId) {
            const targetArr = teamId === 'A' ? teamA : teamB;
            if (targetArr.length === 0) return;
            let bestGkName = "", maxGkScore = -1;
            targetArr.forEach(name => {
                if (allPlayersData[name] && allPlayersData[name].골레이로 > maxGkScore) { maxGkScore = allPlayersData[name].골레이로; bestGkName = name; }
            });
            targetArr.forEach(name => {
                const posEl = document.getElementById(`pos-${teamId}-${name}`);
                if (!posEl) return;
                if (name === bestGkName) posEl.value = "골레이로";
                else {
                    const stats = allPlayersData[name];
                    const fieldMap = { "아라": stats.아라, "피보": stats.피보, "픽소": stats.픽소 };
                    let maxVal = -1, bestPos = "아라";
                    for (let pos in fieldMap) { if (fieldMap[pos] > maxVal) { maxVal = fieldMap[pos]; bestPos = pos; } }
                    posEl.value = bestPos;
                }
                updateRoleOptions(teamId, name);
            });
        }

        function toggleSelection(name) {
            const idx = selectedPoolPlayers.indexOf(name);
            if (idx > -1) selectedPoolPlayers.splice(idx, 1); else selectedPoolPlayers.push(name); renderPool();
        }
        function assignSelected(teamId) {
            const targetArr = teamId === 'A' ? teamA : teamB;
            if (targetArr.length + selectedPoolPlayers.length > 6) return alert("최대 6명까지만 등록 가능합니다.");
            selectedPoolPlayers.forEach(name => { targetArr.push(name); availablePlayers = availablePlayers.filter(p => p !== name); });
            selectedPoolPlayers = []; renderPool(); renderTeams();
        }
        function removeFromTeam(teamId, name) {
            const targetArr = teamId === 'A' ? teamA : teamB;
            targetArr.splice(targetArr.indexOf(name), 1); availablePlayers.push(name); renderPool(); renderTeams();
        }
        window.onload = initApp;

        // --- [매치 엔진 그래픽/로직 영역 V12.0] ---
        const canvas = document.getElementById('pitch'); const ctx = canvas.getContext('2d');
        let gameState = 'STOPPED'; 
        let deadBallType = ''; 
        let deadBallTimer = 0; let matchTime = 0; const MAX_TIME = 780; 
        let score = { A: 0, B: 0 };
        let ball = { x: 325, y: 190, z: 0, vx: 0, vy: 0, vz: 0, owner: null, lastTouchedTeam: null, lastPasser: null, isShot: false };
        let activePlayers = []; 
        let statUpdateCounter = 0;

        function getAngleDiff(a1, a2) {
            let diff = a1 - a2;
            while(diff < -Math.PI) diff += Math.PI * 2;
            while(diff > Math.PI) diff -= Math.PI * 2;
            return Math.abs(diff);
        }

        function drawPitch() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.strokeStyle = 'white'; ctx.lineWidth = 2;
            ctx.strokeRect(5, 5, canvas.width - 10, canvas.height - 10);
            ctx.beginPath(); ctx.moveTo(canvas.width/2, 5); ctx.lineTo(canvas.width/2, canvas.height-5); ctx.stroke();
            ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height/2, 45, 0, Math.PI * 2); ctx.stroke();
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.fillRect(5, 110, 65, 160); ctx.fillRect(canvas.width - 70, 110, 65, 160);
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.fillRect(0, 163, 10, 54); ctx.fillRect(canvas.width - 10, 163, 10, 54);

            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(10, 163, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(10, 217, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(canvas.width-10, 163, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(canvas.width-10, 217, 3, 0, Math.PI*2); ctx.fill();
        }

        function drawBall() {
            let scale = 1 + (ball.z / 100); 
            let r = 5 * scale;
            if(ball.z > 0) {
                ctx.beginPath(); ctx.arc(ball.x, ball.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fill();
            }
            let drawY = ball.y - ball.z;
            ctx.beginPath(); ctx.arc(ball.x, drawY, r, 0, Math.PI * 2);
            ctx.fillStyle = 'white'; ctx.fill(); ctx.strokeStyle = 'black'; ctx.lineWidth = 1; ctx.stroke();
            ctx.beginPath(); ctx.arc(ball.x, drawY, r*0.4, 0, Math.PI * 2);
            ctx.fillStyle = 'black'; ctx.fill();
        }

        function drawPlayers() {
            activePlayers.forEach(p => {
                ctx.beginPath(); ctx.arc(p.x, p.y, 11, 0, Math.PI * 2);
                ctx.fillStyle = p.team === 'A' ? '#cddc39' : '#e67e22'; 
                ctx.fill(); ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5; ctx.stroke();
                
                if(teamTactics[p.team].currentPattern !== 'NONE' && (p === ball.owner || p === teamTactics[p.team].mainTarget)) {
                    ctx.beginPath(); ctx.arc(p.x, p.y, 14, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(241, 196, 15, 0.8)'; ctx.stroke();
                }

                if(p.stunTimer > 0) {
                    ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                    ctx.fillStyle = '#e74c3c'; ctx.fill();
                }

                if(p.isLineBreaking && gameState === 'PLAYING') {
                    ctx.beginPath(); ctx.moveTo(p.x, p.y); 
                    ctx.lineTo(p.x + Math.cos(p.heading)*15, p.y + Math.sin(p.heading)*15);
                    ctx.strokeStyle = '#f39c12'; ctx.lineWidth = 2; ctx.stroke(); ctx.lineWidth = 1.5;
                }

                ctx.fillStyle = 'white'; ctx.font = '10px Arial'; ctx.textAlign = 'center';
                ctx.fillText(p.name, p.x, p.y - 15); 
                let roleShort = p.position === '골레이로' ? 'GK' : p.role.substring(0, 2);
                ctx.fillStyle = '#f1c40f'; ctx.fillText(`[${roleShort}]`, p.x, p.y + 23);
            });
        }

        function updateStatsUI() {
            let t = matchStats.A.posTicks + matchStats.B.posTicks;
            let pA = Math.round((matchStats.A.posTicks / t) * 100); let pB = 100 - pA;
            let pTotA = matchStats.A.passSucc + matchStats.A.passFail;
            let rA = pTotA > 0 ? Math.round((matchStats.A.passSucc / pTotA) * 100) : 0;
            let pTotB = matchStats.B.passSucc + matchStats.B.passFail;
            let rB = pTotB > 0 ? Math.round((matchStats.B.passSucc / pTotB) * 100) : 0;

            document.getElementById('stat-pos-a').innerText = pA + '%'; document.getElementById('stat-pos-b').innerText = pB + '%';
            document.getElementById('stat-shot-a').innerText = `${matchStats.A.shots}(${matchStats.A.sot})`;
            document.getElementById('stat-shot-b').innerText = `${matchStats.B.shots}(${matchStats.B.sot})`;
            document.getElementById('stat-pass-a').innerText = `${rA}% (${matchStats.A.passSucc}/${pTotA})`;
            document.getElementById('stat-pass-b').innerText = `${rB}% (${matchStats.B.passSucc}/${pTotB})`;
            document.getElementById('stat-save-a').innerText = matchStats.A.saves; document.getElementById('stat-save-b').innerText = matchStats.B.saves;
            document.getElementById('stat-ck-a').innerText = matchStats.A.corners; document.getElementById('stat-ck-b').innerText = matchStats.B.corners;
            document.getElementById('stat-fou-a').innerText = matchStats.A.fouls; document.getElementById('stat-fou-b').innerText = matchStats.B.fouls;

            const m = String(Math.floor(matchTime / 60)).padStart(2, '0'); const s = String(Math.floor(matchTime % 60)).padStart(2, '0');
            document.getElementById('timer').innerText = `${m}:${s} / 13:00`;
            
            // 💡 [핵심] UI 매크로 전술 표시
            const getTacticStr = (mode) => {
                if(mode === 'HIGH_PRESS') return '<span style="color:#e74c3c;">전방 압박</span>';
                if(mode === 'HALF_BLOCK') return '<span style="color:#3498db;">라인 대기(지역)</span>';
                if(mode === 'COUNTER') return '<span style="color:#f39c12;">빠른 역습</span>';
                if(mode === 'POSSESSION') return '<span style="color:#2ecc71;">점유율 유지</span>';
                return '기본 전술';
            };
            
            document.getElementById('tactics-display').innerHTML = 
                `A팀: 수비[${getTacticStr(teamTactics.A.defMode)}] / 공격[${getTacticStr(teamTactics.A.offMode)}] &nbsp; | &nbsp; 
                 B팀: 수비[${getTacticStr(teamTactics.B.defMode)}] / 공격[${getTacticStr(teamTactics.B.offMode)}]`;

            let stateText = "";
            if (gameState === 'DEAD_BALL') {
                if(deadBallType === 'KICK_OFF') stateText = "대기: 킥오프 준비 중...";
                else if(deadBallType === 'KICK_IN') stateText = "데드볼: 사이드 킥인 세트피스 준비 중...";
                else stateText = "데드볼 상황 진행 중...";
            }
            document.getElementById('state-display').innerText = stateText;

            if(statUpdateCounter++ % 60 === 0) {
                const tbody = document.getElementById('player-stats-body'); tbody.innerHTML = '';
                let sorted = [...activePlayers].sort((a, b) => calcRating(b.rec) - calcRating(a.rec));
                sorted.forEach(p => {
                    let r = p.rec; let rtg = calcRating(r).toFixed(1);
                    let pTot = r.passSucc + r.passFail; let pRate = pTot > 0 ? Math.round((r.passSucc/pTot)*100) : 0;
                    let cls = p.team === 'A' ? 'col-a' : 'col-b';
                    let roleStr = p.position==='골레이로' ? 'GK' : p.role;
                    let staminaPct = Math.round(p.curStaminaFactor * 100);
                    tbody.innerHTML += `<tr><td class="${cls}"><strong>${p.name}</strong><br><span style="font-size:8px;color:#bdc3c7;">${roleStr} (체력:${staminaPct}%)</span></td>
                        <td><span style="font-size:12px;font-weight:bold;color:${rtg>=7.5?'#f1c40f':(rtg<5.5?'#e74c3c':'white')}">${rtg}</span></td>
                        <td>${r.goals}(${r.assists})</td><td>${r.shots}(${r.sot})</td><td>${r.passSucc}/${pTot} (${pRate}%)</td><td>${r.saves}/${r.tackles}</td></tr>`;
                });
            }
        }

        function calcRating(rec) {
            let base = 6.0 + (rec.goals * 1.5) + (rec.assists * 1.0) + (rec.sot * 0.2) + (rec.shots * 0.1) + (rec.saves * 0.4) + (rec.tackles * 0.3);
            base += (rec.passSucc * 0.05) - (rec.passFail * 0.15) - (rec.mistakes * 0.2); 
            return Math.max(1.0, Math.min(10.0, base));
        }

        // 💡 [핵심] 시간에 따른 팀 단위 매크로 전술(Macro Tactics) 업데이트
        function updateTeamStrategies() {
            if(statUpdateCounter % 30 !== 0) return; // 0.5초마다 갱신
            ['A', 'B'].forEach(team => {
                let myScore = score[team];
                let oppScore = score[team === 'A' ? 'B' : 'A'];
                let timeRatio = matchTime / MAX_TIME;
                
                // 수비 모드 (지고 있고 후반전이면 전방압박, 이기고 있고 종반이면 하프블록)
                if (myScore < oppScore && timeRatio > 0.5) teamTactics[team].defMode = 'HIGH_PRESS';
                else if (myScore > oppScore && timeRatio > 0.6) teamTactics[team].defMode = 'HALF_BLOCK';
                else teamTactics[team].defMode = 'NORMAL';
                
                // 공격 모드
                if (teamTactics[team].defMode === 'HALF_BLOCK') teamTactics[team].offMode = 'COUNTER';
                else if (myScore > oppScore && timeRatio > 0.5) teamTactics[team].offMode = 'POSSESSION';
                else teamTactics[team].offMode = 'NORMAL';
            });
        }

        function handleDeadBallState() {
            deadBallTimer -= 1/60;
            let teamToPlay = ball.owner ? ball.owner.team : (ball.lastTouchedTeam === 'A' ? 'B' : 'A');
            
            activePlayers.forEach(p => {
                p.isLineBreaking = false; 
                p.stunTimer = 0; 
                let targetX = p.homeX, targetY = p.homeY;
                let isOurHalf = (p.team === 'A' ? ball.x < canvas.width/2 : ball.x > canvas.width/2);
                let oppGoalX = p.team === 'A' ? canvas.width - 20 : 20;
                
                if (deadBallType === 'KICK_IN' || deadBallType === 'FREE_KICK') {
                    if (p.team === teamToPlay) {
                        if (p.position !== '골레이로' && !p.isSetPiece) {
                            if (p.position === '피보') {
                                targetX = oppGoalX; targetY = canvas.height / 2 + Math.sin(p.x) * 40; 
                            } else if (isOurHalf) {
                                if (p.position === '픽소') {
                                    targetX = ball.x + (p.team === 'A' ? -30 : 30);
                                    targetY = ball.y > canvas.height/2 ? ball.y - 40 : ball.y + 40;
                                } else if (p.position === '아라') {
                                    targetX = ball.x + (p.team === 'A' ? 35 : -35);
                                    targetY = ball.y > canvas.height/2 ? ball.y - 60 : ball.y + 60;
                                }
                            } else {
                                targetX = oppGoalX + (p.team === 'A' ? -80 : 80);
                                targetY = 190 + Math.sin(p.x * 123) * 80;
                            }
                        }
                    } else {
                        let myGoalX = p.team === 'A' ? 30 : canvas.width - 30;
                        targetX = myGoalX + (p.team === 'A' ? 50 : -50);
                        targetY = 190 + (p.homeY - 190) * 0.5;
                    }
                }
                
                let dx = targetX - p.x; let dy = targetY - p.y;
                let dist = Math.hypot(dx, dy);
                if(dist > 5) { p.x += (dx/dist)*3; p.y += (dy/dist)*3; }
                p.heading = Math.atan2(dy, dx);
            });

            if (deadBallTimer <= 0) {
                let kicker = null; let myTeamPlayers = activePlayers.filter(p => p.team === teamToPlay);
                
                if (deadBallType === 'KICK_OFF') {
                    const priority = {'피보': 1, '아라': 2, '픽소': 3, '골레이로': 4};
                    myTeamPlayers.sort((a, b) => priority[a.position] - priority[b.position]);
                    kicker = myTeamPlayers[0];
                    if (kicker.position === '피보') {
                        kicker.x = canvas.width/2 + (kicker.team === 'A' ? -48 : 48); 
                        kicker.y = canvas.height/2;
                    } else {
                        kicker.x = ball.x; kicker.y = ball.y;
                    }
                } 
                else if (deadBallType === 'KICK_IN' || deadBallType === 'FREE_KICK') {
                    let excludePlayer = null; let minX = 9999;
                    myTeamPlayers.forEach(p => {
                        if (p.position === '픽소' || p.role === '수비 전담') {
                            let distToOwnGoal = p.team === 'A' ? p.x : canvas.width - p.x;
                            if (distToOwnGoal < minX) { minX = distToOwnGoal; excludePlayer = p; }
                        }
                    });
                    
                    let minDist = 9999;
                    myTeamPlayers.forEach(p => {
                        if (p === excludePlayer && myTeamPlayers.length > 2) return; 
                        if (p.position === '골레이로') return; 
                        let d = Math.hypot(ball.x - p.x, ball.y - p.y);
                        if (d < minDist) { minDist = d; kicker = p; }
                    });
                    if(!kicker) kicker = myTeamPlayers[0];
                    kicker.x = ball.x; kicker.y = ball.y;
                } else {
                    let minDist = 9999;
                    myTeamPlayers.forEach(p => {
                        let d = Math.hypot(ball.x - p.x, ball.y - p.y);
                        if (d < minDist) { minDist = d; kicker = p; }
                    });
                    kicker.x = ball.x; kicker.y = ball.y;
                }
                
                if(kicker) {
                    ball.owner = kicker; ball.z = 0; ball.vz = 0;
                    kicker.isSetPiece = true; 
                    addLog(`[진행] ${teamToPlay}팀 ${kicker.name} 선수의 킥으로 재개됩니다.`);
                }
                gameState = 'PLAYING';
            }
        }

        function evaluatePatternTrigger(team) {
            if (teamTactics[team].currentPattern !== 'NONE' || !ball.owner || ball.owner.team !== team) return;
            
            // 점유율 모드일 땐 무리한 패턴(컷인/오버랩 등 템포 올리는 전술) 자제
            if (teamTactics[team].offMode === 'POSSESSION' && Math.random() < 0.7) return; 

            let pivo = activePlayers.find(p => p.team === team && p.position === '피보');
            let fixo = activePlayers.find(p => p.team === team && p.position === '픽소');
            let alas = activePlayers.filter(p => p.team === team && p.position === '아라');

            if (ball.owner === fixo && pivo && alas.length > 0 && Math.random() < 0.25) { 
                teamTactics[team].currentPattern = 'PIVO_TARGET';
                teamTactics[team].timer = 4.0; teamTactics[team].mainTarget = pivo;
                addLog(`🔥 [전술 지시] ${team}팀, 피보를 활용한 3-1 컷인 패턴 전개!`);
                return;
            }
            if (ball.owner.position === '아라' && fixo && Math.random() < 0.2) {
                teamTactics[team].currentPattern = 'ALA_OVERLAP';
                teamTactics[team].timer = 3.5; teamTactics[team].mainTarget = ball.owner; 
                addLog(`🌪️ [전술 지시] ${team}팀, 측면 아라의 오버랩 패턴 시도!`);
            }
        }

        function updateGame() {
            if (gameState === 'DEAD_BALL' || gameState === 'KICK_OFF') { handleDeadBallState(); return; }
            if (gameState !== 'PLAYING') return;

            matchTime += (1/60) * 6.5; 
            if (matchTime >= MAX_TIME) { gameState = 'STOPPED'; matchTime = MAX_TIME; updateStatsUI(); addLog("경기 종료!"); alert("경기가 종료되었습니다!"); return; }

            updateTeamStrategies();

            ['A', 'B'].forEach(t => {
                if(teamTactics[t].currentPattern !== 'NONE') {
                    teamTactics[t].timer -= 1/60;
                    if(teamTactics[t].timer <= 0) teamTactics[t].currentPattern = 'NONE';
                }
            });

            if (!ball.owner) {
                ball.x += ball.vx; ball.y += ball.vy; ball.z += ball.vz;
                ball.vz -= 0.8; 
                if (ball.z <= 0) {
                    ball.z = 0; ball.vz *= -0.4; 
                    if(Math.abs(ball.vz) < 1) ball.vz = 0;
                    ball.vx *= 0.90; ball.vy *= 0.90; 
                }
                
                if (ball.z < 25) {
                    let posts = [{x: 10, y: 163}, {x: 10, y: 217}, {x: canvas.width-10, y: 163}, {x: canvas.width-10, y: 217}];
                    posts.forEach(post => {
                        if(Math.hypot(ball.x - post.x, ball.y - post.y) < 6) {
                            ball.vx *= -1.2; ball.vy *= -1.2;
                            ball.x += ball.vx; ball.y += ball.vy;
                            addLog(`💥 [골대 강타] 슈팅이 골포스트를 맞고 튕겨 나옵니다!`);
                        }
                    });
                }
            } else {
                let dir = ball.owner.team === 'A' ? 1 : -1;
                ball.x = ball.owner.x + Math.cos(ball.owner.heading) * 12; 
                ball.y = ball.owner.y + Math.sin(ball.owner.heading) * 12;
                ball.z = 0; ball.vz = 0;
                ball.lastTouchedTeam = ball.owner.team;
                matchStats[ball.owner.team].posTicks++;

                evaluatePatternTrigger(ball.owner.team); 
            }

            if (!ball.owner && ball.z < 15) { 
                activePlayers.forEach(p => {
                    if(p.stunTimer > 0) return; 

                    let dist = Math.hypot(ball.x - p.x, ball.y - p.y);
                    if(ball.isShot && p.position === '골레이로' && p.team !== ball.lastTouchedTeam && dist < 18) {
                        p.rec.saves++; matchStats[p.team].saves++; ball.isShot = false; 
                        if(ball.lastPasser && ball.lastPasser.team !== p.team) ball.lastPasser = null;
                        addLog(`🧤 [선방] ${p.name} 골키퍼의 멋진 세이브!`);
                    }
                    if (dist < 12 && Math.hypot(ball.vx, ball.vy) < 8) { 
                        ball.owner = p; ball.vx = 0; ball.vy = 0; ball.z = 0; 
                        
                        if(ball.lastTouchedTeam !== p.team && teamTactics[ball.lastTouchedTeam].currentPattern !== 'NONE') {
                            addLog(`⚠️ [전술 실패] 수비에 가로막혀 패턴이 무산됩니다.`);
                            teamTactics[ball.lastTouchedTeam].currentPattern = 'NONE';
                        }
                        
                        // 역습 모드일 때 공을 탈취하면 즉시 발동
                        if(ball.lastTouchedTeam !== p.team && teamTactics[p.team].offMode === 'COUNTER') {
                            addLog(`🚀 [역습 전개] ${p.team}팀! 라인을 올리며 빠른 역습을 전개합니다!`);
                        }
                        
                        ball.lastTouchedTeam = p.team; ball.isShot = false;
                        if(ball.lastPasser && ball.lastPasser.team !== p.team) ball.lastPasser = null;
                    }
                });
            }

            const teamWithBall = ball.owner ? ball.owner.team : null;

            activePlayers.forEach(p => {
                if(p.stunTimer > 0) { p.stunTimer -= 1/60; return; }

                let staminaStat = p.stats.체력 || 10;
                let dropRate = (20 - staminaStat) * 0.03 * (matchTime / MAX_TIME); 
                p.curStaminaFactor = Math.max(0.6, 1.0 - dropRate); 
                
                let curSpeed = p.stats.스피드 * p.curStaminaFactor;
                let curShoot = p.stats.슛 * p.curStaminaFactor;
                let curPass = p.stats.패스 * p.curStaminaFactor;
                let curLongPass = p.stats.롱패스 * p.curStaminaFactor;

                let targetX = p.x, targetY = p.y;
                let isOff = (teamWithBall === p.team); 
                let distToBall = Math.hypot(ball.x - p.x, ball.y - p.y);
                let dir = p.team === 'A' ? 1 : -1;
                let oppGoalX = p.team === 'A' ? canvas.width - 5 : 5;
                let myGoalX = p.team === 'A' ? 5 : canvas.width - 5;
                
                p.isLineBreaking = false; 

                let tState = teamTactics[p.team];

                if (p === ball.owner) {
                    let distToGoal = Math.hypot(oppGoalX - p.x, 190 - p.y);
                    let shootProb = ((p.team === 'A' && p.x < canvas.width/2) || (p.team === 'B' && p.x > canvas.width/2)) ? 0.005 : (distToGoal < 100 ? 0.25 : 0.05 + ((canvas.width/2 - distToGoal) / (canvas.width/2)) * 0.05);

                    // 점유율 모드일 땐 무리한 슛 자제
                    if (tState.offMode === 'POSSESSION') shootProb *= 0.5; 

                    if (tState.currentPattern === 'PIVO_TARGET') {
                        if (p.position === '픽소' && tState.timer > 3.0) {
                            ball.owner = null; p.rec.passSucc++; matchStats[p.team].passSucc++; ball.lastPasser = p;
                            let angle = Math.atan2(tState.mainTarget.y - p.y, tState.mainTarget.x - p.x);
                            let power = (curPass > 12) ? 11 : 9; 
                            if (curPass < 8) power -= 3; 
                            ball.vx = Math.cos(angle) * power; ball.vy = Math.sin(angle) * power;
                            return;
                        } 
                        else if (p.position === '피보' && tState.timer < 3.8) {
                            let runningAla = activePlayers.find(a => a.team === p.team && a.position === '아라');
                            if(runningAla && Math.random() < 0.2) {
                                ball.owner = null; p.rec.passSucc++; matchStats[p.team].passSucc++; ball.lastPasser = p;
                                let angle = Math.atan2(runningAla.y - p.y, runningAla.x - p.x);
                                ball.vx = Math.cos(angle) * 7; ball.vy = Math.sin(angle) * 7;
                                addLog(`🎯 [약속된 플레이] 피보가 컷인하는 아라에게 완벽하게 내어줍니다!`);
                                tState.currentPattern = 'NONE';
                                return;
                            }
                        }
                    } 
                    else if (tState.currentPattern === 'ALA_OVERLAP') {
                        if (p.position === '아라' && p === tState.mainTarget && tState.timer > 3.0) {
                            let fixo = activePlayers.find(f => f.team === p.team && f.position === '픽소');
                            if(fixo) {
                                ball.owner = null; p.rec.passSucc++; matchStats[p.team].passSucc++; ball.lastPasser = p;
                                let angle = Math.atan2(fixo.y - p.y, fixo.x - p.x);
                                ball.vx = Math.cos(angle) * 8; ball.vy = Math.sin(angle) * 8;
                                return;
                            }
                        }
                        else if (p.position === '픽소' && tState.timer < 3.2) {
                            let runningAla = tState.mainTarget;
                            if(runningAla && Math.random() < 0.2) {
                                ball.owner = null; p.rec.passSucc++; matchStats[p.team].passSucc++; ball.lastPasser = p;
                                let targetSpaceX = runningAla.x + dir * 60;
                                let angle = Math.atan2(runningAla.y - p.y, targetSpaceX - p.x);
                                ball.vx = Math.cos(angle) * 10; ball.vy = Math.sin(angle) * 10;
                                addLog(`🎯 [약속된 플레이] 오버랩하는 아라에게 픽소의 스루패스가 연결됩니다!`);
                                tState.currentPattern = 'NONE';
                                return;
                            }
                        }
                    }
                    
                    if(p.isSetPiece) {
                        let mates = activePlayers.filter(t => t.team === p.team && t !== p && t.position !== '골레이로');
                        if(mates.length > 0) {
                            mates.sort((a,b) => Math.hypot(a.x - p.x, a.y - p.y) - Math.hypot(b.x - p.x, b.y - p.y));
                            let targetMate = (Math.random() < 0.5) ? mates[0] : (mates.filter(m => m.position === '피보')[0] || mates[mates.length - 1]);
                            
                            ball.owner = null; p.isSetPiece = false; p.justIntercepted = false;
                            p.rec.passSucc++; matchStats[p.team].passSucc++; ball.lastPasser = p; 
                            
                            let angle = Math.atan2(targetMate.y - p.y, targetMate.x - p.x);
                            let distToMate = Math.hypot(targetMate.x - p.x, targetMate.y - p.y);
                            
                            let power = distToMate > 150 ? 8 : 5; 
                            ball.vx = Math.cos(angle) * power; ball.vy = Math.sin(angle) * power;
                            ball.vz = distToMate > 150 ? power * 0.4 : 0; 
                            addLog(`[세트피스] ${p.name} ➔ ${targetMate.name}`);
                        }
                    } 
                    else if(p.justIntercepted && Math.random() < 0.4) {
                        let mates = activePlayers.filter(t => t.team === p.team && t !== p);
                        let validMates = mates.filter(m => getAngleDiff(p.heading, Math.atan2(m.y - p.y, m.x - p.x)) < Math.PI / 3);
                        if(validMates.length > 0) {
                            let targetMate = validMates[Math.floor(Math.random() * validMates.length)];
                            ball.owner = null; p.justIntercepted = false;
                            p.rec.passSucc++; matchStats[p.team].passSucc++; ball.lastPasser = p;
                            let angle = Math.atan2(targetMate.y - p.y, targetMate.x - p.x);
                            ball.vx = Math.cos(angle) * 7; ball.vy = Math.sin(angle) * 7;
                            addLog(`⚡ [원터치 패스] ${p.name} ➔ ${targetMate.name} (탈취 직후 역습!)`);
                        } else {
                            p.justIntercepted = false;
                            p.heading += (Math.random() > 0.5 ? Math.PI/2 : -Math.PI/2); 
                        }
                    }
                    else if (Math.random() < shootProb && curShoot >= 10) {
                        ball.owner = null; p.justIntercepted = false;
                        matchStats[p.team].shots++; p.rec.shots++;
                        let isGoal = Math.random() * 25 <= (curShoot - 1); 
                        let isSot = isGoal || Math.random() * 22 <= (curShoot + 3);
                        let shotPower = 6 + (curShoot / 5); 

                        if (isSot) {
                            matchStats[p.team].sot++; p.rec.sot++; ball.isShot = true;
                            if(isGoal) {
                                addLog(`⚽ [슈팅] ${p.name} 슈팅! 골문으로 향합니다!`);
                                let angle = Math.atan2((Math.random()>0.5? 170 : 210) - p.y, oppGoalX - p.x);
                                ball.vx = Math.cos(angle) * shotPower; ball.vy = Math.sin(angle) * shotPower;
                                ball.vz = Math.random() * 3;
                            } else {
                                addLog(`⚡ [슈팅] ${p.name} 유효슈팅! 키퍼 정면!`);
                                let gk = activePlayers.find(e => e.team !== p.team && e.position === '골레이로');
                                let angle = Math.atan2((gk ? gk.y : 190) - p.y, oppGoalX - p.x);
                                ball.vx = Math.cos(angle) * (shotPower - 1); ball.vy = Math.sin(angle) * (shotPower - 1);
                                ball.vz = Math.random() * 2;
                            }
                        } else {
                            addLog(`❌ [실수] ${p.name} 슛 미스! 빗나갑니다.`);
                            p.rec.mistakes++;
                            let angle = Math.atan2(190 + (Math.random()-0.5)*150 - p.y, oppGoalX - p.x);
                            ball.vx = Math.cos(angle) * shotPower; ball.vy = Math.sin(angle) * shotPower;
                            ball.vz = 6 + Math.random() * 5; 
                        }
                    } 
                    else if (Math.random() < (tState.offMode === 'POSSESSION' ? 0.2 : 0.12)) {
                        // 점유율 전술 시 패스 빈도 크게 상승
                        let mates = activePlayers.filter(t => t.team === p.team && t !== p);
                        let visibleMates = mates.filter(m => getAngleDiff(p.heading, Math.atan2(m.y - p.y, m.x - p.x)) < Math.PI / 2.5);
                        
                        if (visibleMates.length > 0) {
                            let breakers = visibleMates.filter(m => m.isLineBreaking);
                            let targetMate = null; let isKillerPass = false;

                            if (breakers.length > 0 && Math.random() < 0.7 && tState.offMode !== 'POSSESSION') { 
                                targetMate = breakers[Math.floor(Math.random() * breakers.length)];
                                isKillerPass = true;
                            } else {
                                visibleMates.sort((a,b) => Math.abs(b.y - p.y) - Math.abs(a.y - p.y));
                                targetMate = visibleMates[Math.floor(Math.random() * Math.min(2, visibleMates.length))];
                            }
                            
                            ball.owner = null; p.justIntercepted = false;
                            let distToMate = Math.hypot(targetMate.x - p.x, targetMate.y - p.y);
                            let passAccuracy = distToMate > 160 ? curLongPass : curPass;
                            
                            // 점유율 모드일 땐 짧은 패스 성공률 보정
                            if (tState.offMode === 'POSSESSION' && distToMate < 100) passAccuracy += 3;
                            
                            let isPassSucc = Math.random() * 20 <= passAccuracy + (isKillerPass ? 3 : 5);
                            let angle = Math.atan2(targetMate.y - p.y, targetMate.x - p.x);
                            
                            if (isPassSucc) {
                                p.rec.passSucc++; matchStats[p.team].passSucc++; ball.lastPasser = p; 
                                if(isKillerPass) addLog(`🔥 [킬패스] ${p.name} ➔ 공간을 찢는 스루패스!`);
                                else addLog(`[${distToMate > 160 ? '롱패스' : '패스'}] ${p.name} ➔ ${targetMate.name}`);
                                
                                let power = isKillerPass ? 8 : (distToMate > 160 ? 8 : 5.5); 
                                ball.vx = Math.cos(angle) * power; ball.vy = Math.sin(angle) * power;
                                if(distToMate > 160) ball.vz = power * 0.4; 
                            } else {
                                p.rec.passFail++; matchStats[p.team].passFail++; p.rec.mistakes++; ball.lastPasser = null;
                                addLog(`⚠️ [패스 실수] ${p.name} 패스 미스!`);
                                let randomAngle = p.heading + (Math.random()-0.5); 
                                ball.vx = Math.cos(randomAngle) * 4; ball.vy = Math.sin(randomAngle) * 4;
                            }
                        } else {
                            p.heading += (Math.random() > 0.5 ? Math.PI/2 : -Math.PI/2);
                        }
                    } else {
                        let angleToGoal = Math.atan2(190 - p.y, oppGoalX - p.x);
                        p.heading += getAngleDiff(angleToGoal, p.heading) * 0.1 * (angleToGoal > p.heading ? 1 : -1);
                        targetX = p.x + Math.cos(p.heading) * 30;
                        targetY = p.y + Math.sin(p.heading) * 30;
                    }
                } else if (isOff) {
                    if (tState.currentPattern === 'PIVO_TARGET') {
                        if (p.position === '아라') {
                            targetX = oppGoalX - dir * 15; targetY = 190 + (p.homeY > 190 ? 20 : -20);
                            p.isLineBreaking = true;
                        } else if (p.position === '피보') {
                            targetX = oppGoalX - dir * 80; targetY = 190;
                        } else if (p.position === '픽소') {
                            targetX = ball.x - dir * 25; targetY = ball.y;
                        }
                    }
                    else if (tState.currentPattern === 'ALA_OVERLAP') {
                        if (p === tState.mainTarget) {
                            targetX = oppGoalX - dir * 10; targetY = p.homeY;
                            p.isLineBreaking = true;
                        } else if (p.position === '픽소') {
                            targetX = p.homeX + dir*20; targetY = 190;
                        } else if (p.position === '피보') {
                            targetX = oppGoalX - dir*30; targetY = 190;
                        }
                    }
                    else {
                        // 💡 [핵심 V12.0 공격 매크로 전술]
                        if (tState.offMode === 'COUNTER') {
                            // 역습 모드: 아라와 피보가 미친듯이 전방 질주
                            if (p.position === '피보' || p.position === '아라') {
                                targetX = oppGoalX - dir * 15;
                                targetY = p.homeY;
                                p.isLineBreaking = true;
                            } else if (p.position === '픽소') {
                                targetX = ball.x - dir * 20; targetY = ball.y; // 뒤에서 받쳐줌
                            }
                        } 
                        else if (tState.offMode === 'POSSESSION') {
                            // 점유율 모드: 전원이 공을 가진 선수 쪽으로 다가옴
                            targetX = ball.x - dir * 40 + (p.homeY > 190 ? 20 : -20);
                            targetY = ball.y + (p.homeY > 190 ? 40 : -40);
                            if(p.position === '피보') targetX = oppGoalX - dir * 100; // 피보만 살짝 전방
                        } 
                        else {
                            // 일반 오프더볼
                            if (p.position === '피보') { 
                                if (p.role === '라인 브레이커') {
                                    targetX = oppGoalX - dir * 15; targetY = ball.y + Math.sin(matchTime * 4 + p.x) * 70;
                                    p.isLineBreaking = true;
                                } else { 
                                    targetX = oppGoalX - dir * 60; targetY = 190 + Math.sin(matchTime * 2 + p.x) * 40; 
                                }
                            }
                            else if (p.position === '아라') {
                                let hasPivoOwner = ball.owner && ball.owner.position === '피보' && Math.abs(ball.owner.y - 190) < 50;
                                if(hasPivoOwner) {
                                    targetX = oppGoalX - dir * 20; targetY = p.role === '중앙 침투' ? 190 : (p.homeY < 190 ? 20 : 360);
                                    p.isLineBreaking = true;
                                } else {
                                    let timeOffset = Math.sin(matchTime * 3 + p.y) * 40;
                                    if (p.role === '측면 돌파') {
                                        targetX = ball.x + dir * 70; targetY = (p.homeY < 190 ? 30 : 350) + timeOffset; 
                                    } else { 
                                        targetX = ball.x + dir * 50;
                                        let isOppFlank = (ball.y < 190 && p.homeY > 190) || (ball.y > 190 && p.homeY < 190);
                                        targetY = isOppFlank ? 190 + (p.homeY < 190 ? -30 : 30) : (p.homeY < 190 ? 60 : 320);
                                    }
                                }
                            } 
                            else if (p.position === '픽소') {
                                targetX = p.homeX + (ball.x - p.homeX)*0.5; targetY = 190;
                            }
                            else if (p.position === '골레이로') {
                                targetX = myGoalX + dir * 80; targetY = 190;
                            }
                        }
                    }
                } else {
                    if (p.position === '골레이로') {
                        targetX = myGoalX + dir * 15; targetY = Math.max(163, Math.min(217, ball.y)); 
                        if(distToBall < 60) { targetX = ball.x; targetY = ball.y; }
                    } else {
                        // 💡 [핵심 V12.0 수비 매크로 전술]
                        let defShiftX = 0;
                        if(tState.defMode === 'HIGH_PRESS') defShiftX = dir * 60; // 전방 압박
                        
                        let teammatesBack = activePlayers.filter(t => t.team === p.team && t !== p && Math.abs(t.x - myGoalX) < Math.abs(p.x - myGoalX));
                        if (p.position === '픽소' && teammatesBack.length <= 1) { 
                            targetX = myGoalX + dir * 60; targetY = 190; 
                        } else {
                            let nearestDef = null; let minDistToBall = 9999;
                            activePlayers.filter(def => def.team === p.team && def.position !== '골레이로').forEach(def => {
                                let d = Math.hypot(ball.x - def.x, ball.y - def.y);
                                if (d < minDistToBall) { minDistToBall = d; nearestDef = def; }
                            });

                            if (p === nearestDef) {
                                targetX = ball.x; targetY = ball.y; 
                                
                                if (distToBall < 15 && ball.owner && ball.owner.team !== p.team) {
                                    let tackleChance = p.stats.가로채기 ? (p.stats.가로채기 / 100) : 0.05;
                                    if(Math.random() < tackleChance) {
                                        let loser = ball.owner;
                                        loser.rec.mistakes++; loser.rec.tackled = (loser.rec.tackled||0) + 1;
                                        loser.stunTimer = 1.5; 
                                        loser.x -= (loser.team === 'A' ? -15 : 15);
                                        
                                        ball.owner = p; p.rec.tackles = (p.rec.tackles||0) + 1; ball.lastPasser = null;
                                        p.justIntercepted = true; 
                                        addLog(`🛡️ [태클 성공] ${p.name} 훌륭한 차단으로 소유권을 뺏어옵니다!`);
                                    } else if (Math.random() < 0.002) {
                                        matchStats[p.team].fouls++; addLog(`[반칙] ⚠️ ${p.name} 거친 반칙! 상대팀 프리킥`);
                                        ball.owner = null; ball.vx = 0; ball.vy = 0; ball.isShot = false; ball.lastPasser = null;
                                        ball.y = ball.y < canvas.height/2 ? 15 : canvas.height - 15;
                                        deadBallType = 'FREE_KICK'; deadBallTimer = 2; gameState = 'DEAD_BALL';
                                    }
                                }
                            } else {
                                let blockX = ball.x - dir * 60; 
                                let compact = Math.max(0.2, 1 - Math.abs(myGoalX - ball.x)/300);
                                
                                if(tState.defMode === 'HALF_BLOCK') {
                                    // 하프블록: 중앙선을 넘지 않고 촘촘하게 수비
                                    blockX = myGoalX + dir * 150; 
                                    compact = 0.5; // 간격 좁힘
                                }
                                
                                targetX = p.homeX + (blockX - p.homeX) * 0.7 + defShiftX;
                                targetY = p.homeY + (ball.y - p.homeY) * compact * 0.8;
                                
                                if (Math.abs(p.x - myGoalX) < 150) {
                                    targetX = myGoalX + dir * 40 + (p.homeX - myGoalX)*0.3;
                                    targetY = 190 + (p.homeY - 190)*0.5;
                                }
                            }
                        }
                    }
                }

                let dx = targetX - p.x; let dy = targetY - p.y;
                let dist = Math.hypot(dx, dy);
                
                if(dist > 3) {
                    let moveSpeed = (curSpeed / 10) * (p === ball.owner ? 0.65 : 0.85); 
                    if(p.isLineBreaking || (tState.currentPattern !== 'NONE' && p.team === teamWithBall)) moveSpeed *= 1.3; 
                    p.x += (dx / dist) * moveSpeed; p.y += (dy / dist) * moveSpeed;
                    if(p !== ball.owner) p.heading = Math.atan2(dy, dx);
                }
                p.x = Math.max(15, Math.min(canvas.width - 15, p.x)); p.y = Math.max(15, Math.min(canvas.height - 15, p.y));
            });

            if (!ball.owner) {
                if (ball.x <= 10 && ball.y >= 163 && ball.y <= 217) {
                    if(ball.z > 30) { addLog("💥 [크로스바 강타!] 슈팅이 높게 뜹니다!"); ball.x = 25; ball.y = 190; ball.vx=0; ball.vy=0; deadBallType = 'GOAL_CLEARANCE'; deadBallTimer = 2; gameState = 'DEAD_BALL'; }
                    else goalScored('B');
                }
                else if (ball.x >= canvas.width - 10 && ball.y >= 163 && ball.y <= 217) {
                    if(ball.z > 30) { addLog("💥 [크로스바 강타!] 슈팅이 높게 뜹니다!"); ball.x = canvas.width-25; ball.y = 190; ball.vx=0; ball.vy=0; deadBallType = 'GOAL_CLEARANCE'; deadBallTimer = 2; gameState = 'DEAD_BALL'; }
                    else goalScored('A');
                }
                else if (ball.y <= 5 || ball.y >= canvas.height - 5) {
                    ball.vx = 0; ball.vy = 0; ball.isShot = false; ball.y = ball.y <= 5 ? 15 : canvas.height - 15; 
                    deadBallType = 'KICK_IN'; deadBallTimer = 2.5; gameState = 'DEAD_BALL';
                }
                else if (ball.x <= 5 || ball.x >= canvas.width - 5) {
                    ball.vx = 0; ball.vy = 0; ball.isShot = false;
                    let outTeam = ball.lastTouchedTeam;
                    let defendingSide = ball.x <= 5 ? 'A' : 'B';
                    if (outTeam === defendingSide) {
                        matchStats[outTeam === 'A' ? 'B' : 'A'].corners++;
                        ball.x = ball.x <= 5 ? 15 : canvas.width - 15;
                        ball.y = ball.y < canvas.height/2 ? 15 : canvas.height - 15;
                        deadBallType = 'KICK_IN'; 
                    } else {
                        ball.x = ball.x <= 5 ? 25 : canvas.width - 25; ball.y = 190;
                        deadBallType = 'GOAL_CLEARANCE';
                    }
                    deadBallTimer = 2.5; gameState = 'DEAD_BALL';
                }
            }

            updateStatsUI();
        }

        function goalScored(teamName) {
            gameState = 'STOPPED'; score[teamName]++;
            const scoreBoard = document.getElementById('scoreboard');
            document.getElementById(`score${teamName}`).innerText = score[teamName];
            scoreBoard.classList.add('flash-anim');
            
            let scorer = activePlayers.find(p => p.team === teamName && p === ball.owner);
            if(!scorer && ball.lastTouchedTeam === teamName) {
                scorer = activePlayers.filter(p => p.team === teamName).sort((a,b)=>Math.hypot(a.x-ball.x,a.y-ball.y)-Math.hypot(b.x-ball.x,b.y-ball.y))[0];
            }
            if(scorer) scorer.rec.goals++;
            
            let assistMsg = "";
            if(ball.lastPasser && ball.lastPasser.team === teamName && ball.lastPasser !== scorer) {
                ball.lastPasser.rec.assists++;
                assistMsg = ` (도움: ${ball.lastPasser.name})`;
            }
            
            addLog(`⚽ [득점 폭발] GOAL!!! ${scorer ? scorer.name : teamName} 득점!${assistMsg} 스코어 ${score.A}:${score.B}`);
            
            setTimeout(() => {
                scoreBoard.classList.remove('flash-anim'); 
                ball.owner = null; ball.vx = 0; ball.vy = 0; ball.isShot = false; ball.lastPasser = null;
                ball.x = canvas.width/2; ball.y = canvas.height/2; ball.lastTouchedTeam = teamName; 
                deadBallType = 'KICK_OFF'; deadBallTimer = 3; gameState = 'DEAD_BALL'; 
                
                teamTactics.A.currentPattern = 'NONE'; teamTactics.B.currentPattern = 'NONE';
            }, 3000);
        }

        function loop() {
            drawPitch();
            if(gameState === 'PLAYING' || gameState === 'DEAD_BALL') updateGame();
            drawPlayers(); drawBall(); requestAnimationFrame(loop);
        }

        function startGame() {
            if (teamA.length !== 6 || teamB.length !== 6) return alert("각 팀 6명 필수입니다.");
            matchTime = 0; score = { A: 0, B: 0 }; statUpdateCounter = 0;
            matchStats = {
                A: { posTicks: 1, shots: 0, sot: 0, passSucc: 0, passFail: 0, fouls: 0, saves: 0, corners: 0 },
                B: { posTicks: 1, shots: 0, sot: 0, passSucc: 0, passFail: 0, fouls: 0, saves: 0, corners: 0 }
            };
            teamTactics = { A: { currentPattern: 'NONE', timer: 0, mainTarget: null, defMode: 'NORMAL', offMode: 'NORMAL' }, B: { currentPattern: 'NONE', timer: 0, mainTarget: null, defMode: 'NORMAL', offMode: 'NORMAL' } };
            
            document.getElementById('scoreA').innerText = 0; document.getElementById('scoreB').innerText = 0;
            document.getElementById('match-log').innerHTML = '';
            
            activePlayers = []; ball.owner = null; ball.x = 325; ball.y = 190; ball.z = 0; ball.lastTouchedTeam = 'B'; ball.lastPasser = null;
            
            let pTotalA = { '골레이로': 0, '아라': 0, '픽소': 0, '피보': 0 }; teamA.forEach(n => pTotalA[document.getElementById(`pos-A-${n}`).value]++);
            let pTotalB = { '골레이로': 0, '아라': 0, '픽소': 0, '피보': 0 }; teamB.forEach(n => pTotalB[document.getElementById(`pos-B-${n}`).value]++);

            const getHomePos = (team, pos, posCount, totalInPos) => {
                let x, y = 190;
                if(pos === '골레이로') x = 30; else if(pos === '픽소') x = 140; else if(pos === '아라') x = 240; else if(pos === '피보') x = 330;
                if (totalInPos === 1) y = 190; else if (totalInPos === 2) y = posCount === 0 ? 80 : 300; 
                else if (totalInPos === 3) y = posCount === 0 ? 190 : (posCount === 1 ? 70 : 310); else y = 70 + (posCount * 55); 
                if (team === 'B') x = canvas.width - x; return {x, y};
            };

            const initPlayer = (name, team, pCountObj, pTotalObj) => {
                const s = allPlayersData[name] || { 체력: 10, 스피드: 10, 슛: 10, 패스: 10, 롱패스: 10, 가로채기: 10 }; 
                const pos = document.getElementById(`pos-${team}-${name}`).value;
                const role = document.getElementById(`role-${team}-${name}`).value;
                const home = getHomePos(team, pos, pCountObj[pos]++, pTotalObj[pos]);
                const rec = { goals: 0, assists: 0, shots: 0, sot: 0, passSucc: 0, passFail: 0, saves: 0, tackles: 0, mistakes: 0, tackled: 0 };
                activePlayers.push({ name, team, stats: s, position: pos, role: role, x: home.x, y: home.y, homeX: home.x, homeY: home.y, rec, curStaminaFactor: 1.0, isSetPiece: false, isLineBreaking: false, heading: (team==='A'? 0 : Math.PI), stunTimer: 0, justIntercepted: false });
            };

            let pCa = { '골레이로': 0, '아라': 0, '픽소': 0, '피보': 0 }; teamA.forEach(n => initPlayer(n, 'A', pCa, pTotalA));
            let pCb = { '골레이로': 0, '아라': 0, '픽소': 0, '피보': 0 }; teamB.forEach(n => initPlayer(n, 'B', pCb, pTotalB));

            addLog("주심의 휘슬과 함께 경기가 시작됩니다!"); deadBallType = 'KICK_OFF'; deadBallTimer = 3; gameState = 'DEAD_BALL'; 
        }

        loop(); 
    </script>
</body>
</html>
