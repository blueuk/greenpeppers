<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>풋고추FC 6v6 매치 엔진</title>
    <style>
        body {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            font-family: 'Malgun Gothic', sans-serif;
        }
        canvas {
            background-color: #27ae60; /* 풋살장 잔디색 */
            border: 5px solid #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>풋고추FC 매치 엔진 (바둑알 뷰)</h1>
    <canvas id="pitch" width="800" height="400"></canvas>

    <script>
        const canvas = document.getElementById('pitch');
        const ctx = canvas.getContext('2d');

        // 1. 경기장 그리기 함수
        function drawPitch() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 중앙선
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 센터 서클
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 50, 0, Math.PI * 2);
            ctx.stroke();

            // 페널티 에어리어 (간단하게 구현)
            ctx.strokeRect(0, canvas.height/2 - 100, 100, 200);
            ctx.strokeRect(canvas.width - 100, canvas.height/2 - 100, 100, 200);
        }

        // 2. 풋고추FC 선수 데이터 (엑셀 데이터 기반 간소화)
        // x, y는 초기 위치, speed는 엑셀의 '스피드' 스탯을 반영
        let teamA = [
            { name: '강승지', role: '골레이로', x: 30, y: 200, color: 'blue', speed: 1.3 },
            { name: '강한팀', role: '픽소', x: 200, y: 200, color: 'blue', speed: 1.6 },
            { name: '김동섭', role: '아라', x: 300, y: 80, color: 'blue', speed: 1.3 },
            { name: '김진혁', role: '아라', x: 300, y: 320, color: 'blue', speed: 1.0 },
            { name: '배장원', role: '피보', x: 350, y: 200, color: 'blue', speed: 1.0 },
            { name: '송정환', role: '서브', x: 150, y: 100, color: 'blue', speed: 1.3 }
        ];

        let teamB = [
            { name: '안성모', role: '골레이로', x: 770, y: 200, color: 'red', speed: 1.3 },
            { name: '상대1', role: '픽소', x: 600, y: 200, color: 'red', speed: 1.4 },
            { name: '상대2', role: '아라', x: 500, y: 80, color: 'red', speed: 1.4 },
            { name: '상대3', role: '아라', x: 500, y: 320, color: 'red', speed: 1.4 },
            { name: '상대4', role: '피보', x: 450, y: 200, color: 'red', speed: 1.5 },
            { name: '상대5', role: '서브', x: 650, y: 300, color: 'red', speed: 1.4 }
        ];

        // 공 객체
        let ball = { x: 400, y: 200, vx: 0, vy: 0 };

        // 3. 바둑알(선수) 그리기
        function drawPlayers(team) {
            team.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 12, 0, Math.PI * 2); // 바둑알 크기
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.stroke();
                
                // 이름 표시
                ctx.fillStyle = 'white';
                ctx.font = '10px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(p.name, p.x, p.y - 15);
            });
        }

        // 공 그리기
        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, 6, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.strokeStyle = 'black';
            ctx.stroke();
        }

        // 4. 로직 업데이트 (간단한 공 쫓아가기 AI)
        function updateLogic() {
            // 데모용: 공이 무작위로 조금씩 움직임
            ball.x += (Math.random() - 0.5) * 4;
            ball.y += (Math.random() - 0.5) * 4;

            // 경기장 밖으로 안 나가게 제한
            if(ball.x < 0) ball.x = 0;
            if(ball.x > 800) ball.x = 800;
            if(ball.y < 0) ball.y = 0;
            if(ball.y > 400) ball.y = 400;

            // 모든 선수가 공을 향해 조금씩 이동 (스피드 스탯 비례)
            const moveToBall = (p) => {
                let dx = ball.x - p.x;
                let dy = ball.y - p.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                
                // 공과 일정 거리 이상 떨어져 있을 때만 이동
                if (dist > 15) { 
                    p.x += (dx / dist) * (p.speed * 0.5); // 스피드 능력치 적용
                    p.y += (dy / dist) * (p.speed * 0.5);
                }
            };

            teamA.forEach(moveToBall);
            teamB.forEach(moveToBall);
        }

        // 5. 게임 루프 (60FPS로 화면 갱신)
        function gameLoop() {
            drawPitch();
            updateLogic();
            drawPlayers(teamA);
            drawPlayers(teamB);
            drawBall();
            
            requestAnimationFrame(gameLoop);
        }

        // 게임 시작
        gameLoop();
    </script>
</body>
</html>
